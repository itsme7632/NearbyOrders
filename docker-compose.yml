services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: nearbyorders, POSTGRES_USER: nearbyorders, POSTGRES_PASSWORD: change-me }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    environment: { DATABASE_URL: postgresql://nearbyorders:change-me@db:5432/nearbyorders?schema=public, JWT_ACCESS_SECRET: change-me-at-least-32-characters, JWT_REFRESH_SECRET: change-me-at-least-32-characters }
    depends_on: [db]
    ports: ["3000:3000"]
volumes: { postgres_data: {} }
