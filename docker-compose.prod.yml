# NearbyOrders PRODUCTION stack (Contabo VPS).
#
# Every secret comes from the environment — see .env.example. Never commit
# real values. The ${VAR:?message} syntax makes compose fail loudly when a
# required variable is missing instead of starting a broken stack.
#
# Deploy sequence (deterministic):
#   1. `db` starts; compose waits until postgres is healthy (pg_isready).
#   2. `migrate` runs `prisma migrate deploy` ONCE against the healthy DB,
#      then exits. Never `prisma migrate dev` in production.
#   3. `api` starts only after migrations complete successfully.
#      With NODE_ENV=production the API fail-fasts on missing/unsafe
#      JWT secrets or CORS_ORIGIN (see resolveServerConfig in server.ts).
#   4. `nginx` serves the public website (nearbyorders.com + www), the admin
#      SPA (admin.nearbyorders.com, with /api/v1 proxied to the API), and the
#      API (api.nearbyorders.com), routing by Host header
#      (see infrastructure/nginx.conf). It binds 127.0.0.1:3100 ONLY.
#
# First-time database initialization (run once, in this order):
#   docker compose -f docker-compose.prod.yml up -d db
#   docker compose -f docker-compose.prod.yml run --rm api node apps/api/node_modules/.bin/tsx apps/api/prisma/seed-categories.ts
#   docker compose -f docker-compose.prod.yml run --rm api node apps/api/node_modules/.bin/tsx apps/api/prisma/seed-plans.ts
#   docker compose -f docker-compose.prod.yml run --rm -e ADMIN_EMAIL=ops@example.com -e ADMIN_PASSWORD='...' api node node_modules/.bin/tsx apps/api/scripts/create-admin.ts
#   docker compose -f docker-compose.prod.yml up -d
# See docs/production-deploy.md for the full runbook. NEVER seed demo data
# (SEED_DEMO_DATA) in production.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nearbyorders}
      POSTGRES_USER: ${POSTGRES_USER:-nearbyorders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nearbyorders} -d $${POSTGRES_DB:-nearbyorders}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    restart: "no"
    command: ["./apps/api/node_modules/.bin/prisma", "migrate", "deploy", "--schema", "apps/api/prisma/schema.prisma"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production environment}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Container-internal port. Hardcoded to match infrastructure/nginx.conf
      # (proxy_pass http://api:3000); the port is not published to the host,
      # so there is no reason to make it configurable here.
      PORT: '3000'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production environment}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in the production environment}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in the production environment}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in the production environment (the public admin origin, e.g. https://admin.example.com)}
      RECEIPTS_DIR: /var/nearbyorders/receipts
      UPLOADS_DIR: /var/nearbyorders/uploads
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_B64: ${FCM_SERVICE_ACCOUNT_B64:-}
    volumes:
      # Persistent receipt/verification storage. The API creates the directory
      # on first write (saveReceipt mkdir -p). Survives container recreation;
      # back this volume up with the database. Files stay behind authorized
      # API endpoints — there is intentionally no public /uploads route.
      - receipts_data:/var/nearbyorders/receipts
      # Persistent business/product image storage (P1). The API creates the
      # directory on first write (saveImage mkdir -p); images are served via
      # the key-validated GET /api/v1/images/* capability endpoint. Survives
      # container recreation; back up with the database.
      - uploads_data:/var/nearbyorders/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["3000"]

  nginx:
    build:
      context: .
      dockerfile: infrastructure/docker/nginx.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    # The Contabo VPS already has a host-level nginx on 80/443 for BrokerMAIL.
    # Bind NearbyOrders nginx only to loopback on a dedicated host port; the
    # host nginx will terminate TLS and proxy the NearbyOrders hostnames here.
    # Never bind this service directly to public 80/443.
    ports: ["127.0.0.1:3100:80"]
    depends_on:
      - api

volumes:
  postgres_data: {}
  receipts_data: {}
  uploads_data: {}
