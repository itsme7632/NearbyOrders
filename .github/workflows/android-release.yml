name: Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build NearbyOrders Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Validate Android signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @nearbyorders/shared build

      - name: Configure production API
        working-directory: apps/mobile
        run: |
          printf 'VITE_API_BASE_URL=https://api.nearbyorders.com/api/v1\n' > .env.production.local

      - name: Build mobile web app
        run: pnpm --filter @nearbyorders/mobile build

      - name: Add Android platform
        working-directory: apps/mobile
        run: pnpm exec cap add android

      - name: Configure Firebase Android
        working-directory: apps/mobile
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON_B64" || { echo 'Missing FIREBASE_GOOGLE_SERVICES_JSON_B64'; exit 1; }
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json

      - name: Sync Capacitor Android
        working-directory: apps/mobile
        run: pnpm exec cap sync android

      - name: Declare location permissions
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          for permission in (
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ):
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in text:
                  text = text.replace(
                      '<uses-permission android:name="android.permission.INTERNET" />',
                      f'<uses-permission android:name="android.permission.INTERNET" />\n    {tag}',
                      1,
                  )

          manifest.write_text(text)
          PY

      - name: Sync NearbyOrders Android brand assets
        run: pnpm --filter @nearbyorders/mobile run android:brand

      - name: Configure permanent Android signing
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/nearbyorders-release.keystore

          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          if "signingConfigs" not in text:
              marker = "android {"
              if marker not in text:
                  raise SystemExit("Could not find android block in app/build.gradle")
              signing = '''android {\n    signingConfigs {\n        release {\n            storeFile file("../nearbyorders-release.keystore")\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }'''
              text = text.replace(marker, signing, 1)

          if "signingConfig signingConfigs.release" not in text:
              marker = "release {"
              if marker not in text:
                  raise SystemExit("Could not find release build type in app/build.gradle")
              text = text.replace(marker, "release {\n            signingConfig signingConfigs.release", 1)

          gradle.write_text(text)
          PY

      - name: Make Gradle executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: Build signed release APK and AAB
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Remove signing material from workspace
        if: always()
        working-directory: apps/mobile
        run: rm -f android/nearbyorders-release.keystore android/app/google-services.json

      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-release-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" \
            "apps/mobile/android/app/build/outputs/apk/release/app-release.apk" \
            "apps/mobile/android/app/build/outputs/bundle/release/app-release.aab" \
            --title "NearbyOrders Android Release #${{ github.run_number }}.${{ github.run_attempt }}" \
            --notes "Signed release build from commit ${{ github.sha }}. Future Android updates must use the same permanent signing key." \
            --latest=false
