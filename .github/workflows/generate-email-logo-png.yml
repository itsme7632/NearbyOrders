name: Generate Email Logo PNG

on:
  push:
    branches:
      - fix/email-logo-png

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/email-logo-png
          fetch-depth: 0

      - name: Generate PNG from approved SVG
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="apps/website/assets/nearbyorders-email-logo.svg",
              write_to="apps/website/assets/nearbyorders-email-logo.png",
              output_width=1024,
              output_height=1024,
          )
          PY

      - name: Commit generated PNG
        run: |
          test -s apps/website/assets/nearbyorders-email-logo.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/website/assets/nearbyorders-email-logo.png
          git commit -m "build: add PNG email logo"
          git push origin fix/email-logo-png
