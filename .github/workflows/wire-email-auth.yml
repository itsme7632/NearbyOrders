name: Wire email auth foundation

on:
  push:
    branches: [feat/email-brand-asset]

permissions:
  contents: write

jobs:
  wire:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: wire email auth') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/email-brand-asset
          fetch-depth: 0

      - name: Patch Prisma schema and server
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          schema = Path('apps/api/prisma/schema.prisma')
          s = schema.read_text()
          if 'enum AuthCodeType' not in s:
              s = s.replace('enum Role {\n  CUSTOMER\n  BUSINESS_OWNER\n  ADMIN\n}\n', 'enum Role {\n  CUSTOMER\n  BUSINESS_OWNER\n  ADMIN\n}\n\nenum AuthCodeType {\n  EMAIL_VERIFICATION\n  PASSWORD_RESET\n}\n')
          if 'emailVerifiedAt' not in s:
              s = s.replace('  isSuspended               Boolean                      @default(false)\n', '  isSuspended               Boolean                      @default(false)\n  emailVerifiedAt           DateTime?                    @default(now())\n')
          elif 'emailVerifiedAt           DateTime?                    @default(now())' not in s:
              s = s.replace('  emailVerifiedAt           DateTime?\n', '  emailVerifiedAt           DateTime?                    @default(now())\n')
          if 'authCodes                 AuthCode[]' not in s:
              s = s.replace('  addresses                 CustomerAddress[]\n', '  addresses                 CustomerAddress[]\n  authCodes                 AuthCode[]\n')
          if 'model AuthCode {' not in s:
              s += '''\n\nmodel AuthCode {\n  id         String       @id @default(uuid())\n  userId     String\n  type       AuthCodeType\n  codeHash   String\n  expiresAt  DateTime\n  createdAt  DateTime     @default(now())\n  consumedAt DateTime?\n  user       User         @relation(fields: [userId], references: [id], onDelete: Cascade)\n\n  @@index([userId, type, createdAt])\n  @@index([expiresAt])\n}\n'''
          schema.write_text(s)

          server = Path('apps/api/src/server.ts')
          s = server.read_text()
          if "from './emailAuth.js'" not in s:
              s = s.replace("import { dispatchPushNotifications } from './push.js';", "import { dispatchPushNotifications } from './push.js';\nimport { registerEmailAuthRoutes } from './emailAuth.js';\nimport { generateCode, hashCode, sendPasswordChangedEmail, sendVerificationEmail } from './email.js';")
          if 'const verificationCode = generateCode();' not in s:
              old = '''      const user = await prisma.user.create({\n        data: {\n          email: d.email.toLowerCase(),\n          passwordHash: await argon2.hash(d.password, { type: argon2.argon2id }),\n          firstName: d.firstName,\n          lastName: d.lastName,\n          role: d.role ?? 'CUSTOMER',\n        },\n      });\n      return r.status(201).send({ data: { id: user.id, email: user.email, role: user.role } });'''
              new = '''      const user = await prisma.user.create({\n        data: {\n          email: d.email.toLowerCase(),\n          passwordHash: await argon2.hash(d.password, { type: argon2.argon2id }),\n          firstName: d.firstName,\n          lastName: d.lastName,\n          role: d.role ?? 'CUSTOMER',\n          emailVerifiedAt: null,\n        },\n      });\n      const verificationCode = generateCode();\n      await prisma.authCode.create({\n        data: { id: randomBytes(16).toString('hex'), userId: user.id, type: 'EMAIL_VERIFICATION', codeHash: hashCode(verificationCode), expiresAt: new Date(Date.now() + 10 * 60 * 1000) },\n      });\n      try {\n        await sendVerificationEmail({ to: user.email, firstName: user.firstName, code: verificationCode, idempotencyKey: `verify/${user.id}/${verificationCode}` });\n      } catch (error) {\n        await prisma.user.delete({ where: { id: user.id } });\n        throw error;\n      }\n      return r.status(201).send({ data: { id: user.id, email: user.email, role: user.role, emailVerificationRequired: true } });'''
              if old not in s: raise SystemExit('register block not found')
              s = s.replace(old, new, 1)
          if 'EMAIL_NOT_VERIFIED' not in s:
              old = '''    if (!user || user.isSuspended || !(await argon2.verify(user.passwordHash, b.password ?? '')))\n      return r.status(401).send({ error: { code: 'INVALID_CREDENTIALS', message: 'Invalid email or password' } });\n    const accessToken = app.jwt.sign({ id: user.id, role: user.role }, { expiresIn: '15m' });'''
              new = '''    if (!user || user.isSuspended || !(await argon2.verify(user.passwordHash, b.password ?? '')))\n      return r.status(401).send({ error: { code: 'INVALID_CREDENTIALS', message: 'Invalid email or password' } });\n    if (!user.emailVerifiedAt)\n      return r.status(403).send({ error: { code: 'EMAIL_NOT_VERIFIED', message: 'Please verify your email before signing in' } });\n    const accessToken = app.jwt.sign({ id: user.id, role: user.role }, { expiresIn: '15m' });'''
              if old not in s: raise SystemExit('login block not found')
              s = s.replace(old, new, 1)
          if 'await registerEmailAuthRoutes(app);' not in s:
              marker = "  app.post('/api/v1/auth/login'"
              idx = s.index(marker)
              s = s[:idx] + "  await registerEmailAuthRoutes(app);\n\n" + s[idx:]
          if "sendPasswordChangedEmail({ to: u.email" not in s:
              old = '''    await prisma.auditLog.create({\n      data: { actorId: u.id, action: 'PASSWORD_CHANGED', entityType: 'User', entityId: u.id },\n    });\n    return r.status(204).send();'''
              new = '''    await prisma.auditLog.create({\n      data: { actorId: u.id, action: 'PASSWORD_CHANGED', entityType: 'User', entityId: u.id },\n    });\n    await sendPasswordChangedEmail({ to: u.email, firstName: u.firstName }).catch((error) => app.log.error(error, 'password-changed email delivery failed'));\n    return r.status(204).send();'''
              if old not in s: raise SystemExit('password block not found')
              s = s.replace(old, new, 1)
          server.write_text(s)

          compose = Path('docker-compose.prod.yml')
          c = compose.read_text()
          if 'RESEND_API_KEY:' not in c:
              needle = '      FCM_SERVICE_ACCOUNT_B64: ${FCM_SERVICE_ACCOUNT_B64:-}\n'
              replacement = needle + '      RESEND_API_KEY: ${RESEND_API_KEY:-}\n      EMAIL_FROM: ${EMAIL_FROM:-NearbyOrders <hello@nearbyorders.com>}\n      EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-https://nearbyorders.com/assets/nearbyorders-email-logo.png}\n'
              if needle not in c: raise SystemExit('production compose FCM block not found')
              compose.write_text(c.replace(needle, replacement, 1))

          env = Path('.env.example')
          e = env.read_text()
          if 'RESEND_API_KEY=' not in e:
              needle = 'FCM_SERVICE_ACCOUNT_B64=""\n'
              replacement = needle + '\n# Transactional/auth email delivery via Resend. Keep the API key server-side only.\nRESEND_API_KEY=""\nEMAIL_FROM="NearbyOrders <hello@nearbyorders.com>"\nEMAIL_LOGO_URL="https://nearbyorders.com/assets/nearbyorders-email-logo.png"\n'
              if needle not in e: raise SystemExit('env example FCM block not found')
              env.write_text(e.replace(needle, replacement, 1))
          PY

      - name: Generate email-safe PNG logo
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --width=176 --height=176 --output=apps/website/assets/nearbyorders-email-logo.png apps/website/assets/nearbyorders-email-logo.svg

      - name: Update lockfile and generate Prisma client
        run: |
          corepack enable
          pnpm install --lockfile-only
          pnpm --filter @nearbyorders/api exec prisma generate

      - name: Typecheck API
        run: pnpm --filter @nearbyorders/api typecheck

      - name: Commit wiring changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/prisma/schema.prisma apps/api/src/server.ts pnpm-lock.yaml docker-compose.prod.yml .env.example apps/website/assets/nearbyorders-email-logo.png
          git commit -m "chore: wire email auth foundation" || exit 0
          git push origin HEAD:feat/email-brand-asset
