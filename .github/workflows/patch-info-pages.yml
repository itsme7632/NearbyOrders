name: Patch info pages
on:
  push:
    branches: [feat/trust-support-and-email-branding]
jobs:
  patch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trust-support-and-email-branding
          fetch-depth: 0
      - name: Patch customer experience exports
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('apps/mobile/src/screens/customer-experience.tsx')
          text = path.read_text()
          marker = "import { PinDropPicker } from '../components/PinDropPicker.js';\n"
          addition = marker + "import { HelpScreen, TermsScreen, PrivacyScreen, AboutScreen } from './InfoScreens.js';\n\nexport { HelpScreen, TermsScreen, PrivacyScreen, AboutScreen };\n"
          if "from './InfoScreens.js'" not in text:
              text = text.replace(marker, addition, 1)
          pattern = re.compile(r"/\* ------------------------------------------------------------------ \*/\n/\* Info pages \(honest placeholders: final legal content comes later\).*?/\* ------------------------------------------------------------------ \*/\n/\* Saved-state hook shared by the business profile heart", re.S)
          replacement = "/* ------------------------------------------------------------------ */\n/* Info pages live in InfoScreens.tsx.                               */\n/* ------------------------------------------------------------------ */\n\n/* ------------------------------------------------------------------ */\n/* Saved-state hook shared by the business profile heart"
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate the existing info-page block')
          path.write_text(updated)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/screens/customer-experience.tsx
          git commit -m "chore: wire expanded info pages" || exit 0
          git push origin feat/trust-support-and-email-branding
