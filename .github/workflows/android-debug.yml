name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build NearbyOrders Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @nearbyorders/shared build

      - name: Configure test API
        working-directory: apps/mobile
        run: |
          printf 'VITE_API_BASE_URL=http://157.230.213.10:3000/api/v1\n' > .env

      - name: Build mobile web app
        run: pnpm --filter @nearbyorders/mobile build

      - name: Add Android platform
        working-directory: apps/mobile
        run: pnpm exec cap add android

      - name: Sync Capacitor Android
        working-directory: apps/mobile
        run: pnpm exec cap sync android

      - name: Sync NearbyOrders Android brand assets
        run: pnpm android:brand

      - name: Enable cleartext HTTP for debug build
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          if "android:usesCleartextTraffic=" not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )

          manifest.write_text(text)
          print("Debug cleartext HTTP support enabled.")
          PY

      - name: Make Gradle executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nearbyorders-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
