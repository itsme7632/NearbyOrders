name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build NearbyOrders Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @nearbyorders/shared build

      - name: Configure test API
        working-directory: apps/mobile
        run: |
          printf 'VITE_API_BASE_URL=http://157.230.213.10:3000/api/v1\n' > .env.production.local

      - name: Build mobile web app
        run: pnpm --filter @nearbyorders/mobile build

      - name: Add Android platform
        working-directory: apps/mobile
        run: pnpm exec cap add android

      - name: Sync Capacitor Android
        working-directory: apps/mobile
        run: pnpm exec cap sync android

      - name: Declare location permissions
        # android/ is gitignored and regenerated by `cap add`, so the manifest
        # permissions live here: the Geolocation plugin's own manifest
        # declares none, and without these the plugin throws
        # OS-PLUG-GLOC-0018 and no location prompt can ever appear.
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          for permission in (
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ):
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in text:
                  text = text.replace(
                      '<uses-permission android:name="android.permission.INTERNET" />',
                      f'<uses-permission android:name="android.permission.INTERNET" />\n    {tag}',
                      1,
                  )

          manifest.write_text(text)
          print("Location permissions declared.")
          PY

      - name: Sync NearbyOrders Android brand assets
        run: pnpm --filter @nearbyorders/mobile run android:brand

      - name: Enable cleartext HTTP for debug build
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          if "android:usesCleartextTraffic=" not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )

          manifest.write_text(text)
          print("Debug cleartext HTTP support enabled.")
          PY

      - name: Make Gradle executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-debug-${{ github.run_number }}-${{ github.run_attempt }}"

          gh release create "$TAG" \
            "apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk" \
            --title "NearbyOrders Android Debug #${{ github.run_number }}.${{ github.run_attempt }}" \
            --notes "Debug APK built from commit ${{ github.sha }}" \
            --prerelease
