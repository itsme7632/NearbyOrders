name: Quality
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nearbyorders/api prisma:generate
      - run: pnpm --filter @nearbyorders/api exec prisma validate
        env:
          DATABASE_URL: postgresql://nearbyorders:ci-only@localhost:5432/nearbyorders?schema=public
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
