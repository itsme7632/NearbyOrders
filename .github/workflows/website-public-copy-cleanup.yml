name: Website public copy cleanup

on:
  push:
    branches:
      - fix/website-public-copy-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: startsWith(github.event.head_commit.message, 'chore(website): add cleanup runner')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove internal implementation copy
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('apps/website/index.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '<p class="store-note">Google Play, Android APK, and App Store availability will be managed from Admin.</p>': '',
              '<p class="store-legal">App Store artwork is used as a platform identifier. The App Store button will become active when the official store URL is configured.</p>': '',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY2

      - name: Verify public website copy
        run: |
          ! grep -RniE 'managed from Admin|app settings|admin panel|served through the NearbyOrders API|build notes|placeholder|production replaces|STICKER BOMB|TODO\(' apps/website --include='*.html'
          ! grep -Rni '—' apps/website --include='*.html'

      - name: Commit cleanup and remove runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/website/index.html .github/workflows/website-public-copy-cleanup.yml
          git rm .github/workflows/website-public-copy-cleanup.yml
          git commit -m 'fix(website): remove internal download copy [skip ci]'
          git push
