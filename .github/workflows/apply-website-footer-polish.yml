name: Apply website footer polish
on:
  push:
    branches: [fix/website-footer-public-links]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Update public footer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/website/index.html')
          s = p.read_text()
          old = '''        <div class="footer-domains">\n          <span><b>nearbyorders.com</b>: website</span>\n          <span><b>admin.nearbyorders.com</b>: admin panel</span>\n          <span><b>api.nearbyorders.com</b>: API</span>\n        </div>\n'''
          if old not in s:
              raise SystemExit('Expected footer domains block not found')
          s = s.replace(old, '', 1)
          p.write_text(s)
          PY
          rm .github/workflows/apply-website-footer-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/website/index.html .github/workflows/apply-website-footer-polish.yml
          git commit -m 'Polish public website footer'
          git push origin HEAD:fix/website-footer-public-links
