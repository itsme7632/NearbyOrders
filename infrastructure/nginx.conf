# NearbyOrders production reverse proxy (Contabo VPS).
#
# This container binds 127.0.0.1:3100 ONLY (see docker-compose.prod.yml).
# Public ports 80/443 stay owned by the host's Nginx, which also serves the
# unrelated BrokerMAIL application. BrokerMAIL's configuration, files,
# processes, database, and volumes are never touched by this stack.
# Host-level server blocks for the three NearbyOrders hostnames live in
# infrastructure/host-nginx/nearbyorders.conf.example (operator installs them;
# TLS/certbot is a host step, documented in docs/production-deploy.md).
#
# Topology:
#   internet -> host nginx -> 127.0.0.1:3100 (this container)
#     nearbyorders.com / www.nearbyorders.com -> public website (static)
#     admin.nearbyorders.com                   -> admin SPA (static, SPA fallback)
#                                              -> /api/v1/* -> api:3000 (Fastify)
#     api.nearbyorders.com                     -> api:3000 (Fastify)
#   api -> db:5432 (PostgreSQL 16)
#
# There is ONE admin panel. It is served from admin.nearbyorders.com and
# governs the whole app + website ecosystem; no website CMS exists.
#
# Receipt/verification files are NEVER served here: they stay behind the
# API's authorized endpoints (no public /uploads route). Business/product
# images are served only through the API's key-validated
# GET /api/v1/images/* capability endpoint.

upstream api {
  server api:3000;
}

# Shared proxy settings for the API.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 30s;

# ---------------------------------------------------------------------------
# Public website: nearbyorders.com + www.nearbyorders.com
# Static marketing site. No API proxying here on purpose: the website must
# never accidentally route to the admin or the API.
# ---------------------------------------------------------------------------
server {
  listen 80;
  server_name nearbyorders.com www.nearbyorders.com;

  root /usr/share/nginx/html/website;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Single static page: serve files that exist, 404 anything else.
  # (No SPA fallback: unknown paths must not silently serve the homepage.)
  location / {
    try_files $uri $uri/ =404;
  }

  # Social preview image referenced by og:image.
  location = /og-cover.png {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}

# ---------------------------------------------------------------------------
# Admin: admin.nearbyorders.com, the ONE unified admin panel.
# The admin SPA keeps its default VITE_API_BASE_URL=/api/v1 (same origin),
# so /api/v1 is proxied to the API from this host as well.
# ---------------------------------------------------------------------------
server {
  listen 80;
  server_name admin.nearbyorders.com;

  root /usr/share/nginx/html/admin;
  index index.html;

  # Receipt uploads are up to 5 MiB; nginx's 1m default would 413 them.
  client_max_body_size 8m;

  # Security headers for the admin SPA (the API sets its own via helmet).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # API: the full /api/v1/* path is proxied untouched; Fastify serves it.
  location /api/v1/ {
    proxy_pass http://api;
  }

  # Liveness for the proxy layer / host health checks.
  location = /healthz {
    proxy_pass http://api/health;
    access_log off;
  }

  # Admin SPA: static files, fall back to index.html for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}

# ---------------------------------------------------------------------------
# API: api.nearbyorders.com -> Fastify.
# /api/v1/* keeps working exactly as before; /health stays the liveness
# endpoint. The API's own CORS/helmet policies still apply.
# ---------------------------------------------------------------------------
server {
  listen 80;
  server_name api.nearbyorders.com;

  client_max_body_size 8m;

  location = /healthz {
    proxy_pass http://api/health;
    access_log off;
  }

  location / {
    proxy_pass http://api;
  }
}

# ---------------------------------------------------------------------------
# Unknown hosts: refuse the connection instead of serving a default site.
# ---------------------------------------------------------------------------
server {
  listen 80 default_server;
  server_name _;
  return 444;
}
