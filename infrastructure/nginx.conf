# NearbyOrders production reverse proxy (Contabo VPS).
#
# Topology:
#   internet -> nginx:80 -> /api/v1/*  -> api:3000   (Fastify)
#                        -> /healthz    -> api:3000/health (liveness)
#                        -> /           -> admin SPA (static dist, SPA fallback)
#
# TLS termination happens above this layer (VPS firewall / certbot on the
# host). To serve 443 directly, extend this file with a second server block.
#
# Receipt/verification files are NEVER served here: they stay behind the
# API's authorized endpoints (no public /uploads route).

upstream api {
  server api:3000;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Receipt uploads are up to 5 MiB; nginx's 1m default would 413 them.
  client_max_body_size 8m;

  # Security headers for the admin SPA (the API sets its own via helmet).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # API: the full /api/v1/* path is proxied untouched — Fastify serves it.
  location /api/v1/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Liveness for the proxy layer / host health checks.
  location = /healthz {
    proxy_pass http://api/health;
    access_log off;
  }

  # Admin SPA: static files, fall back to index.html for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
